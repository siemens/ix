<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0"
    />
    <title>Stencil Component Starter</title>
    <style>
      body {
        display: grid;
        gap: var(--theme-space-5);
        width: 34rem;
      }
    </style>
    <script type="module">
      import { addIcons } from '@siemens/ix-icons';
      import { iconContextMenu, iconInfo } from '@siemens/ix-icons/icons';

      addIcons({
        iconContextMenu,
        iconInfo,
      });
    </script>
  </head>
  <body>
    <ix-content-header
      has-back-button
      header-title="Production line monitoring and diagnostic information"
      header-subtitle="The complete supporting context wraps within the available header width"
    >
      <ix-pill slot="header" icon="info">Online</ix-pill>
      <ix-button variant="tertiary">Edit details</ix-button>
      <ix-icon-button
        icon="context-menu"
        variant="tertiary"
        aria-label="More actions"
      ></ix-icon-button>
    </ix-content-header>

    <ix-content-header
      has-back-button
      header-title="Production line monitoring and diagnostic information"
      header-subtitle="The complete supporting context remains available in a native tooltip"
      text-overflow="truncate"
    >
      <ix-pill slot="header" icon="info">Online</ix-pill>
      <ix-button variant="tertiary">Edit details</ix-button>
      <ix-icon-button
        icon="context-menu"
        variant="tertiary"
        aria-label="More actions"
      ></ix-icon-button>
    </ix-content-header>
    <script src="./../../utils/test/runtime/main.ts" type="module"></script>
  </body>
</html>
