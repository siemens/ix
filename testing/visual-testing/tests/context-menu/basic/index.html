<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0"
    />
    <title>Stencil Component Starter</title>
    <script type="module">
      import { addIcons } from '@siemens/ix-icons';
      import {
        iconCopy,
        iconPaste,
        iconShare,
        iconTrashcan,
      } from '@siemens/ix-icons/icons';

      addIcons({
        iconCopy,
        iconPaste,
        iconShare,
        iconTrashcan,
      });
    </script>
  </head>
  <body style="width: 100vw; height: 100vh">
    <div id="area" style="position: fixed; inset: 0">
      <ix-context-menu aria-label-menu="Actions">
        <ix-dropdown-item icon="copy" label="Copy"></ix-dropdown-item>
        <ix-dropdown-item icon="paste" label="Paste"></ix-dropdown-item>
        <ix-divider></ix-divider>
        <ix-dropdown-item icon="share" label="Share"></ix-dropdown-item>
        <ix-divider></ix-divider>
        <ix-dropdown-item icon="trashcan" label="Delete"></ix-dropdown-item>
      </ix-context-menu>
    </div>
    <script src="./../../utils/test/runtime/main.ts" type="module"></script>
  </body>
</html>
