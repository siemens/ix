<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Style entry-point fixture</title>
    <style>
      .entry-point-fixture {
        padding: 1rem;
      }

      .entry-point-fixture > h1 {
        margin-bottom: 0.75rem;
      }

      .probe-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.75rem;
      }

      .probe-card {
        min-width: 0;
        padding: 0.75rem;
        border: 1px dashed currentColor;
      }

      .probe-card > :first-child {
        margin-top: 0;
      }

      .probe-card > :last-child {
        margin-bottom: 0;
      }

      .scroll-probe {
        width: 100%;
        height: 4rem;
        overflow: auto;
      }

      .scroll-probe-content {
        width: 200%;
        height: 8rem;
        padding: 0.5rem;
      }
    </style>
  </head>
  <body class="disable-scrollbar">
    <script src="./define.ts" type="module"></script>
  </body>
</html>
