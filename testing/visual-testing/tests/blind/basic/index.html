<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0"
    />
    <title>Stencil Component Starter</title>
    <style>
      ix-blind {
        margin: 0.5rem;
      }
    </style>
    <script type="module">
      import { addIcons } from '@siemens/ix-icons';
      import {
        iconBulb,
        iconTrashcan,
        iconRename,
        iconContextMenu,
        iconWarning,
        iconInfo,
      } from '@siemens/ix-icons/icons';

      addIcons({
        iconBulb,
        iconTrashcan,
        iconRename,
        iconContextMenu,
        iconWarning,
        iconInfo,
      });
    </script>
  </head>
  <body>
    <ix-blind outline="false" icon="bulb" label="filled" sublabel="sublabel">
      <div>filled content</div>
    </ix-blind>
    <ix-blind icon="bulb" label="outline" sublabel="sublabel">
      <div>Outline content</div>
    </ix-blind>
    <ix-blind icon="bulb" variant="danger" label="danger" sublabel="sublabel">
      <div>Danger content</div>
    </ix-blind>
    <ix-blind icon="bulb" variant="warning" label="warning" sublabel="sublabel">
      <div>Warning content</div>
    </ix-blind>
    <ix-blind icon="bulb" variant="caution" label="caution" sublabel="sublabel">
      <div>Caution content</div>
    </ix-blind>
    <ix-blind
      icon="bulb"
      variant="information"
      label="information"
      sublabel="sublabel"
    >
      <div>Information content</div>
    </ix-blind>
    <ix-blind icon="bulb" variant="accent" label="accent" sublabel="sublabel">
      <div>Accent content</div>
    </ix-blind>
    <ix-blind
      icon="bulb"
      variant="critical"
      label="critical"
      sublabel="sublabel"
    >
      <div>Critical content</div>
    </ix-blind>
    <ix-blind icon="bulb" variant="success" label="success" sublabel="sublabel">
      <div>Success content</div>
    </ix-blind>
    <ix-blind icon="bulb" variant="neutral" label="neutral" sublabel="sublabel">
      <div>Neutral content</div>
    </ix-blind>
    <ix-blind
      icon="warning"
      variant="warning"
      label="A long asset name that does not fit to blind header"
      subLabel="subLabel A long asset name that does not fit"
      style="width: 300px"
    >
      <ix-icon-button
        id="context-menu"
        slot="header-actions"
        variant="subtle-tertiary"
        icon="context-menu"
      ></ix-icon-button>
    </ix-blind>
    <script src="./../../utils/test/runtime/main.ts" type="module"></script>
  </body>
</html>
