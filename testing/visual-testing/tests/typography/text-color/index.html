<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0"
    />
    <title>Stencil Component Starter</title>
    <style>
      .inv-bg {
        background-color: var(--si-sys-color-background-inverse);
      }
    </style>
  </head>
  <body>
    <ix-typography text-color="caution">Caution</ix-typography>
    <ix-typography text-color="critical">Critical</ix-typography>
    <ix-typography text-color="danger">Danger</ix-typography>
    <ix-typography text-color="information">Information</ix-typography>
    <ix-typography text-color="success">Success</ix-typography>
    <ix-typography text-color="warning">Warning</ix-typography>
    <ix-typography text-color="primary">Primary</ix-typography>
    <ix-typography text-color="secondary">Secondary</ix-typography>
    <ix-typography text-color="disabled">Disabled</ix-typography>

    <div class="inv-bg">
      <ix-typography text-color="inverse">Inverse</ix-typography>
    </div>

    <div id="on-container"></div>

    <script>
      const onColors = [
        'caution',
        'critical',
        'danger',
        'information',
        'neutral',
        'accent',
        'success',
        'warning',
      ];
      const onBackgroundTokens = {
        caution: '--si-sys-color-background-caution',
        critical: '--si-sys-color-background-critical',
        danger: '--si-sys-color-background-danger',
        information: '--si-sys-color-background-information',
        neutral: '--si-sys-color-background-neutral',
        accent: '--si-sys-color-background-accent',
        success: '--si-sys-color-background-success',
        warning: '--si-sys-color-background-warning',
      };
      const onContainer = document.getElementById('on-container');
      onColors.forEach((color) => {
        const div = document.createElement('div');
        div.style.backgroundColor = `var(${onBackgroundTokens[color]})`;
        div.innerHTML = `<ix-typography text-color="on-${color}">on-${color}</ix-typography>`;
        onContainer.appendChild(div);
      });
    </script>

    <script src="./../../utils/test/runtime/main.ts" type="module"></script>
  </body>
</html>
