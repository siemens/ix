<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0"
    />
    <title>Stencil Component Starter</title>
  </head>
  <body>
    <script>
      const textFormats = [
        'body',
        'body-sbold',
        'body-paragraph',
        'body-paragraph-sbold',
        'body-sm',
        'body-sm-sbold',
        'body-lg',
        'body-lg-sbold',

        'display-xxl',
        'display-xxl-sbold',
        'display-xl',
        'display-xl-sbold',
        'display-lg',
        'display-lg-sbold',
        'display',

        'h1',
        'h2',
        'h3',
        'h4',
        'h5',
        'h5-bold',
        'h6',

        'code-lg',
        'code',
        'code-sm',
      ];

      textFormats.map(format => {
        const typography = document.createElement('ix-typography');
        typography.format = format;
        typography.innerHTML = format;
        typography.textDecoration = 'underline';
        document.body.appendChild(typography);
      });
    </script>
    <script src="./../../utils/test/runtime/main.ts" type="module"></script>
  </body>
</html>
