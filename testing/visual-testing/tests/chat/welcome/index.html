<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0"
    />
    <title>Chat welcome screen</title>
    <style>
      :root {
        color: var(--si-sys-color-text-primary);
        font-family: var(--si-ref-typography-font-family-sans);
      }

      .chat-visual-page {
        min-height: 100vh;
        box-sizing: border-box;
        padding: 1.5rem;
        background: var(--si-sys-color-background-0);
      }

      ix-chat {
        width: 40rem;
        height: 28rem;
        min-width: 0;
        border: 1px solid var(--si-sys-color-border-4);
        border-radius: 0.25rem;
        background: var(--si-sys-color-background-0);
      }
    </style>
    <script type="module">
      import { addIcons } from '@siemens/ix-icons';
      import { iconSendRightFilled } from '@siemens/ix-icons/icons';

      addIcons({
        iconSendRightFilled,
      });
    </script>
  </head>
  <body>
    <main class="chat-visual-page">
      <ix-chat>
        <ix-chat-welcome slot="welcome" heading="How can I help you today?">
          <p>
            Ask about alarms, assets or maintenance plans of your production
            lines.
          </p>
          <ix-chat-prompt-suggestion slot="suggestions">
            Summarize open alarms
          </ix-chat-prompt-suggestion>
          <ix-chat-prompt-suggestion slot="suggestions">
            Which assets need maintenance first?
          </ix-chat-prompt-suggestion>
          <ix-chat-prompt-suggestion slot="suggestions">
            Create a weekly status report
          </ix-chat-prompt-suggestion>
        </ix-chat-welcome>
        <ix-chat-input slot="prompt"></ix-chat-input>
      </ix-chat>
    </main>
    <script src="./../../utils/test/runtime/main.ts" type="module"></script>
  </body>
</html>
