<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0"
    />
    <title>Chat input interrupt</title>
    <style>
      :root {
        color: var(--si-sys-color-text-primary);
        font-family: var(--si-ref-typography-font-family-sans);
      }

      .chat-visual-page {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        min-height: 100vh;
        box-sizing: border-box;
        padding: 1.5rem;
        background: var(--si-sys-color-background-0);
      }

      ix-chat-input {
        width: 36rem;
      }
    </style>
    <script type="module">
      import { addIcons } from '@siemens/ix-icons';
      import {
        iconCircleStop,
        iconSendRightFilled,
      } from '@siemens/ix-icons/icons';

      addIcons({
        iconCircleStop,
        iconSendRightFilled,
      });
    </script>
  </head>
  <body>
    <main class="chat-visual-page">
      <ix-chat-input interruptible state="processing"></ix-chat-input>
      <ix-chat-input interruptible state="interrupting"></ix-chat-input>
    </main>
    <script src="./../../utils/test/runtime/main.ts" type="module"></script>
  </body>
</html>
