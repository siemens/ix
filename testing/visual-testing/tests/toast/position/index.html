<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0"
    />
    <title>Stencil Component Starter</title>
    <script type="module">
      import { addIcons } from '@siemens/ix-icons';
      import { iconBulb } from '@siemens/ix-icons/icons';

      addIcons({
        iconBulb,
      });
    </script>
  </head>
  <body>
    <ix-toast-container></ix-toast-container>
    <script>
      (async () => {
        await window.customElements.whenDefined('ix-toast-container');
        const toastContainer = document.querySelector('ix-toast-container');

        toastContainer.position = 'top-right';

        // Figma order: Success, Information, Warning, Error, Custom icon, Danger, Caution, Critical.
        const types = [
          'success',
          'information',
          'warning',
          'error',
          'danger',
          'caution',
          'critical',
        ];

        for (const type of types) {
          await toastContainer.showToast({
            message: type.charAt(0).toUpperCase() + type.slice(1),
            type,
            autoClose: false,
          });
        }

        await toastContainer.showToast({
          icon: 'bulb',
          message: 'Custom icon',
          type: 'information',
          autoClose: false,
        });

        await toastContainer.showToast({
          message: 'Information - Icon Hidden',
          type: 'information',
          hideIcon: true,
          autoClose: false,
        });
      })();
    </script>
    <script src="./../../utils/test/runtime/main.ts" type="module"></script>
  </body>
</html>
