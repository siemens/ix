<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0"
    />
    <title>Stencil Component Starter</title>
    <style>
      ix-chip {
        margin-left: 0.25rem;
      }
    </style>
    <script type="module">
      import { addIcons } from '@siemens/ix-icons';
      import { iconPrint } from '@siemens/ix-icons/icons';

      addIcons({
        iconPrint,
      });
    </script>
  </head>
  <body>
    <div style="text-align: center; margin-top: 2rem">
      <ix-chip closable outline> Accent </ix-chip>
      <ix-chip icon="print">Accent with icon</ix-chip>
      <ix-chip
        icon="print"
        style="width: 10rem"
        closable
        onClose="{console.log}"
        onClick="{console.log}"
      >
        Accent
      </ix-chip>

      <ix-chip variant="critical" closable outline>
        Critical
      </ix-chip>
      <ix-chip variant="danger" icon="print">
        Danger with icon
      </ix-chip>
      <ix-chip
        variant="danger"
        icon="print"
        style="width: 10rem"
        closable
        onClose="{console.log}"
        onClick="{console.log}"
      >
        Danger
      </ix-chip>
      <ix-chip
        variant="warning"
        icon="print"
        style="width: 10rem"
        closable
        onClose="{console.log}"
        onClick="{console.log}"
      >
        Warning
      </ix-chip>
      <ix-chip center-content closable icon="print" style="width: 15rem"
        >Centered content
      </ix-chip>
    </div>
    <div
      style="
        display: flex;
        gap: 2rem;
        margin-top: 2rem;
        justify-content: center;
      "
    >
      <div
        style="
          display: flex;
          flex-direction: column;
          gap: 0.5rem;
          flex: 1;
          max-width: 300px;
        "
      >
        <ix-chip icon="print" variant="accent" outline closable>
          Accent
        </ix-chip>
        <ix-chip icon="print" variant="danger" outline closable>
          Danger
        </ix-chip>
        <ix-chip icon="print" variant="critical" outline>
          Critical
        </ix-chip>
        <ix-chip icon="print" variant="warning" outline>
          Warning
        </ix-chip>
        <ix-chip icon="print" variant="information" outline>
          Information
        </ix-chip>
        <ix-chip icon="print" variant="success" outline>
          Success
        </ix-chip>
        <ix-chip icon="print" variant="neutral" outline class="chip-left-margin"
          >Neutral</ix-chip
        >
        <ix-chip
          icon="print"
          variant="custom"
          background="#FF00FF"
          outline
          closable
          >Custom</ix-chip
        >
      </div>
      <div
        style="
          display: flex;
          flex-direction: column;
          gap: 0.5rem;
          flex: 1;
          max-width: 300px;
        "
      >
        <ix-chip icon="print" variant="accent" closable>Accent</ix-chip>
        <ix-chip icon="print" variant="danger" closable>Danger</ix-chip>
        <ix-chip icon="print" variant="critical">Critical</ix-chip>
        <ix-chip icon="print" variant="warning">Warning</ix-chip>
        <ix-chip icon="print" variant="information">Information</ix-chip>
        <ix-chip icon="print" variant="success">Success</ix-chip>
        <ix-chip icon="print" variant="neutral">Neutral</ix-chip>
        <ix-chip
          icon="print"
          variant="custom"
          background="#FF00FF"
          chip-color="black"
          closable
          >Custom</ix-chip
        >
      </div>
    </div>
    <script src="./../../utils/test/runtime/main.ts" type="module"></script>
  </body>
</html>
