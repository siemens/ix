<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0"
      name="viewport"
    />
    <title>Stencil Component Starter</title>
    <script type="module">
      import { addIcons } from '@siemens/ix-icons';
      import { iconHome, iconStar } from '@siemens/ix-icons/icons';

      addIcons({

        iconStar,
      });

      <ix-application-header></ix-application-header>

          label="Category with a long name"

          <ix-menu-item icon="home" notifications="10">Sub 1</ix-menu-item>
          <ix-menu-item notifications="7">Sub 2</ix-menu-item>
          <ix-menu-item icon="star">Sub 3</ix-menu-item>
          <ix-menu-item>Sub 4</ix-menu-item>
        </ix-menu-category>
        <ix-menu-item icon="star" notifications="99">Item 2</ix-menu-item>
        <ix-menu-item icon="home" disabled>Disabled</ix-menu-item>
        <ix-menu-item slot="bottom" icon="star">Bottom</ix-menu-item>
      </ix-menu>
    </ix-application>
    <script src="./../../utils/test/runtime/main.ts" type="module"></script>
  </body>
