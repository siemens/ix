<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0"
    />
    <title>Card selected</title>
    <style>
      ix-card {
        margin: 1rem;
      }

      .card-content {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <ix-card selected variant="default">
      <div class="card-content">
        <ix-typography>Default</ix-typography>
      </div>
    </ix-card>
    <ix-card selected variant="default" outline="false">
      <div class="card-content">
        <ix-typography>Filled</ix-typography>
      </div>
    </ix-card>
    <ix-card selected variant="danger">
      <div class="card-content">
        <ix-typography>Danger</ix-typography>
      </div>
    </ix-card>
    <ix-card selected variant="warning">
      <div class="card-content">
        <ix-typography>Warning</ix-typography>
      </div>
    </ix-card>
    <ix-card selected variant="caution">
      <div class="card-content">
        <ix-typography>Caution</ix-typography>
      </div>
    </ix-card>
    <ix-card selected variant="information">
      <div class="card-content">
        <ix-typography>Information</ix-typography>
      </div>
    </ix-card>
    <ix-card selected variant="accent">
      <div class="card-content">
        <ix-typography>Accent</ix-typography>
      </div>
    </ix-card>
    <ix-card selected variant="critical">
      <div class="card-content">
        <ix-typography>Critical</ix-typography>
      </div>
    </ix-card>
    <ix-card selected variant="success">
      <div class="card-content">
        <ix-typography>Success</ix-typography>
      </div>
    </ix-card>
    <ix-card selected variant="neutral">
      <div class="card-content">
        <ix-typography>Neutral</ix-typography>
      </div>
    </ix-card>
    <script src="./../../utils/test/runtime/main.ts" type="module"></script>
  </body>
</html>
