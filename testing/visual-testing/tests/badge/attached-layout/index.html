<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0"
    />
    <title>Badge attached layout</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .page {
        display: block;
        padding: 20px;
        box-sizing: border-box;
        max-width: 30rem;
      }

      .row {
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        gap: 1rem;
      }

      .host-block {
        display: block;
        position: relative;
        background: var(--si-sys-background-danger);
        color: var(--si-sys-text-on-danger);
        width: 50%;
        height: 6rem;
        box-sizing: border-box;
        padding: 0.75rem;
      }

      .host-block.sibling {
        background: var(--si-sys-background-information);
        color: var(--si-sys-text-on-information);
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="row">
        <ix-badge type="counter" label="5" variant="alarm">
          <div class="host-block">Content (inside ix-badge)</div>
        </ix-badge>
        <div class="host-block sibling">Content (always outside badge)</div>
      </div>
    </div>

    <script src="./../../utils/test/runtime/main.ts" type="module"></script>
  </body>
</html>
