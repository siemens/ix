<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0"
    />
    <title>Badge counter</title>
    <style>
      body {
        padding: 1.5rem;
        box-sizing: border-box;
      }

      h2 {
        font: var(--si-sys-typography-h3);
        color: var(--si-sys-color-text-primary);
        margin: 0 0 0.75rem;
      }

      section {
        margin-bottom: 2rem;
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 1.5rem;
      }

      .variant-grid {
        display: grid;
        grid-template-columns: 5rem repeat(3, minmax(0, auto));
        gap: 0.75rem 1.25rem;
        align-items: center;
      }

      .variant-grid .header,
      .variant-grid .row-label {
        font: var(--si-sys-typography-body);
        color: var(--si-sys-color-text-secondary);
      }

      .align-host {
        outline: 1px dashed var(--si-sys-color-border-3);
      }
    </style>
    <script type="module">
      import { addIcons } from '@siemens/ix-icons';
      import { iconInfo } from '@siemens/ix-icons/icons';

      addIcons({ iconInfo });
    </script>
  </head>
  <body>
    <section>
      <h2>Standalone · filled / outline / border</h2>
      <div class="variant-grid">
        <span class="header"></span>
        <span class="header">Filled</span>
        <span class="header">Outline</span>
        <span class="header">Border</span>

        <span class="row-label">Accent</span>
        <ix-badge
          class="align-host"
          type="counter"
          label="8"
          variant="accent"
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="counter"
          label="8"
          variant="accent"
          outline
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="counter"
          label="8"
          variant="accent"
          border
        ></ix-badge>

        <span class="row-label">Danger</span>
        <ix-badge
          class="align-host"
          type="counter"
          label="8"
          variant="danger"
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="counter"
          label="8"
          variant="danger"
          outline
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="counter"
          label="8"
          variant="danger"
          border
        ></ix-badge>

        <span class="row-label">Critical</span>
        <ix-badge
          class="align-host"
          type="counter"
          label="8"
          variant="critical"
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="counter"
          label="8"
          variant="critical"
          outline
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="counter"
          label="8"
          variant="critical"
          border
        ></ix-badge>

        <span class="row-label">Warning</span>
        <ix-badge
          class="align-host"
          type="counter"
          label="8"
          variant="warning"
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="counter"
          label="8"
          variant="warning"
          outline
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="counter"
          label="8"
          variant="warning"
          border
        ></ix-badge>

        <span class="row-label">Caution</span>
        <ix-badge
          class="align-host"
          type="counter"
          label="8"
          variant="caution"
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="counter"
          label="8"
          variant="caution"
          outline
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="counter"
          label="8"
          variant="caution"
          border
        ></ix-badge>

        <span class="row-label">Information</span>
        <ix-badge
          class="align-host"
          type="counter"
          label="8"
          variant="information"
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="counter"
          label="8"
          variant="information"
          outline
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="counter"
          label="8"
          variant="information"
          border
        ></ix-badge>

        <span class="row-label">Success</span>
        <ix-badge
          class="align-host"
          type="counter"
          label="8"
          variant="success"
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="counter"
          label="8"
          variant="success"
          outline
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="counter"
          label="8"
          variant="success"
          border
        ></ix-badge>

        <span class="row-label">Neutral</span>
        <ix-badge
          class="align-host"
          type="counter"
          label="8"
          variant="neutral"
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="counter"
          label="8"
          variant="neutral"
          outline
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="counter"
          label="8"
          variant="neutral"
          border
        ></ix-badge>

        <span class="row-label">Custom</span>
        <ix-badge
          class="align-host"
          type="counter"
          label="8"
          variant="custom"
          background="var(--si-sys-color-data-categorical-9)"
          badge-color="var(--si-sys-color-text-inverse)"
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="counter"
          label="8"
          variant="custom"
          outline
          background="var(--si-sys-color-data-categorical-9)"
          badge-color="var(--si-sys-color-text-primary)"
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="counter"
          label="8"
          variant="custom"
          border
          background="var(--si-sys-color-data-categorical-9)"
          badge-color="var(--si-sys-color-text-inverse)"
        ></ix-badge>
      </div>
    </section>

    <section>
      <h2>Counts · overflow · max-width</h2>
      <div class="row">
        <ix-badge
          class="align-host"
          type="counter"
          label="1"
          variant="accent"
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="counter"
          label="12"
          variant="information"
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="counter"
          label="99"
          variant="warning"
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="counter"
          label="142"
          variant="accent"
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="counter"
          label="99+"
          variant="danger"
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="counter"
          label="0"
          variant="neutral"
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="counter"
          label="-1"
          variant="critical"
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="counter"
          label="142"
          variant="accent"
          style="--ix-badge-max-width: 2rem"
        ></ix-badge>
      </div>
    </section>

    <section>
      <h2>Attached · anchors · position · offset</h2>
      <div class="row">
        <ix-badge type="counter" label="3" variant="danger">
          <ix-button>Review</ix-button>
        </ix-badge>
        <ix-badge type="counter" label="5" variant="warning" outline>
          <ix-icon-button icon="info" aria-label="Inbox"></ix-icon-button>
        </ix-badge>
        <ix-badge type="counter" label="2" variant="information" border>
          <ix-avatar username="User"></ix-avatar>
        </ix-badge>
        <ix-badge
          type="counter"
          label="9"
          variant="success"
          position="bottom-after"
        >
          <ix-button>Bottom after</ix-button>
        </ix-badge>
        <ix-badge
          type="counter"
          label="4"
          variant="accent"
          offset-x="6"
          offset-y="-4"
        >
          <ix-button>Offset</ix-button>
        </ix-badge>
      </div>
    </section>

    <script src="./../../utils/test/runtime/main.ts" type="module"></script>
  </body>
</html>
