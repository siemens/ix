<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0"
    />
    <title>Badge dot</title>
    <style>
      body {
        padding: 1.5rem;
        box-sizing: border-box;
      }

      h2 {
        font: var(--si-sys-typography-h3);
        color: var(--si-sys-color-text-primary);
        margin: 0 0 0.75rem;
      }

      section {
        margin-bottom: 2rem;
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 1.5rem;
      }

      .variant-grid {
        display: grid;
        grid-template-columns: 5rem repeat(3, minmax(0, auto));
        gap: 0.75rem 1.25rem;
        align-items: center;
      }

      .variant-grid .header,
      .variant-grid .row-label {
        font: var(--si-sys-typography-body);
        color: var(--si-sys-color-text-secondary);
      }

      .align-host {
        outline: 1px dashed var(--si-sys-color-border-3);
      }
    </style>
    <script type="module">
      import { addIcons } from '@siemens/ix-icons';
      import { iconInfo } from '@siemens/ix-icons/icons';

      addIcons({ iconInfo });
    </script>
  </head>
  <body>
    <section>
      <h2>Standalone · filled / outline / border</h2>
      <div class="variant-grid">
        <span class="header"></span>
        <span class="header">Filled</span>
        <span class="header">Outline</span>
        <span class="header">Border</span>

        <span class="row-label">Accent</span>
        <ix-badge
          class="align-host"
          type="dot"
          variant="accent"
          aria-label="Accent"
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="dot"
          variant="accent"
          outline
          aria-label="Accent outline"
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="dot"
          variant="accent"
          border
          aria-label="Accent border"
        ></ix-badge>

        <span class="row-label">Danger</span>
        <ix-badge
          class="align-host"
          type="dot"
          variant="danger"
          aria-label="Danger"
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="dot"
          variant="danger"
          outline
          aria-label="Danger outline"
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="dot"
          variant="danger"
          border
          aria-label="Danger border"
        ></ix-badge>

        <span class="row-label">Critical</span>
        <ix-badge
          class="align-host"
          type="dot"
          variant="critical"
          aria-label="Critical"
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="dot"
          variant="critical"
          outline
          aria-label="Critical outline"
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="dot"
          variant="critical"
          border
          aria-label="Critical border"
        ></ix-badge>

        <span class="row-label">Warning</span>
        <ix-badge
          class="align-host"
          type="dot"
          variant="warning"
          aria-label="Warning"
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="dot"
          variant="warning"
          outline
          aria-label="Warning outline"
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="dot"
          variant="warning"
          border
          aria-label="Warning border"
        ></ix-badge>

        <span class="row-label">Caution</span>
        <ix-badge
          class="align-host"
          type="dot"
          variant="caution"
          aria-label="Caution"
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="dot"
          variant="caution"
          outline
          aria-label="Caution outline"
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="dot"
          variant="caution"
          border
          aria-label="Caution border"
        ></ix-badge>

        <span class="row-label">Information</span>
        <ix-badge
          class="align-host"
          type="dot"
          variant="information"
          aria-label="Information"
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="dot"
          variant="information"
          outline
          aria-label="Information outline"
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="dot"
          variant="information"
          border
          aria-label="Information border"
        ></ix-badge>

        <span class="row-label">Success</span>
        <ix-badge
          class="align-host"
          type="dot"
          variant="success"
          aria-label="Success"
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="dot"
          variant="success"
          outline
          aria-label="Success outline"
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="dot"
          variant="success"
          border
          aria-label="Success border"
        ></ix-badge>

        <span class="row-label">Neutral</span>
        <ix-badge
          class="align-host"
          type="dot"
          variant="neutral"
          aria-label="Neutral"
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="dot"
          variant="neutral"
          outline
          aria-label="Neutral outline"
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="dot"
          variant="neutral"
          border
          aria-label="Neutral border"
        ></ix-badge>

        <span class="row-label">Custom</span>
        <ix-badge
          class="align-host"
          type="dot"
          variant="custom"
          background="var(--si-sys-color-data-categorical-9)"
          badge-color="var(--si-sys-color-text-inverse)"
          aria-label="Custom"
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="dot"
          variant="custom"
          outline
          background="var(--si-sys-color-data-categorical-9)"
          badge-color="var(--si-sys-color-text-primary)"
          aria-label="Custom outline"
        ></ix-badge>
        <ix-badge
          class="align-host"
          type="dot"
          variant="custom"
          border
          background="var(--si-sys-color-data-categorical-9)"
          badge-color="var(--si-sys-color-text-inverse)"
          aria-label="Custom border"
        ></ix-badge>
      </div>
    </section>

    <section>
      <h2>Attached · anchors · position · offset</h2>
      <div class="row">
        <ix-badge type="dot" variant="danger">
          <ix-button>Notifications</ix-button>
        </ix-badge>
        <ix-badge type="dot" variant="accent" outline>
          <ix-icon-button icon="info" aria-label="Inbox"></ix-icon-button>
        </ix-badge>
        <ix-badge type="dot" variant="warning" border>
          <ix-avatar username="User"></ix-avatar>
        </ix-badge>
        <ix-badge type="dot" variant="information" position="bottom-after">
          <ix-button>Bottom after</ix-button>
        </ix-badge>
        <ix-badge type="dot" variant="success" offset-x="6" offset-y="-4">
          <ix-button>Offset</ix-button>
        </ix-badge>
      </div>
    </section>

    <script src="./../../utils/test/runtime/main.ts" type="module"></script>
  </body>
</html>
