      - gridcell /\d+ October \d+/
      - gridcell /\d+ October \d+/
      - gridcell /\d+ October \d+/
    - row /\d+ October \d+ \d+ October \d+ \d+ October \d+ \d+ October \d+ \d+ October \d+ \d+ October \d+/:
      - gridcell /\d+ October \d+/
      - gridcell /\d+ October \d+/
