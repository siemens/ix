<!DOCTYPE html>
<html lang="en" data-ix-theme="community" data-ix-color-schema="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings legacy example</title>
    <script type="module" crossorigin src="../assets/preload-helper-UZRgTS1n.js"></script>
    <script type="module" crossorigin src="../assets/index-CgUi6DzV-DGToXfDo.js"></script>
    <script type="module" crossorigin src="../assets/global-CXSgLryr.js"></script>
    <script type="module" crossorigin src="../assets/index-DCCkv1ZQ-DZnlOMEt.js"></script>
    <script type="module" crossorigin src="../assets/init-B_8KV3Pz.js"></script>
    <link rel="stylesheet" crossorigin href="../assets/global-BJqaQhOK.css">
  </head>
  <body>
    <ix-application>
      <ix-application-header>
        <div class="placeholder-logo" slot="logo"></div>
      </ix-application-header>
      <ix-menu>
        <ix-menu-settings active-tab-key="tab-1">
          <ix-menu-settings-item
            tab-key="tab-1"
            label="Example Setting 1"
          ></ix-menu-settings-item>
          <ix-menu-settings-item
            tab-key="tab-2"
            label="Example Setting 2"
          ></ix-menu-settings-item>
        </ix-menu-settings>
      </ix-menu>
    </ix-application>

    <script>
      (async function () {
        await window.customElements.whenDefined('ix-menu');
        const menu = document.querySelector('ix-menu');
        await menu.toggleSettings(true);
      })();
    </script>
  </body>
</html>
