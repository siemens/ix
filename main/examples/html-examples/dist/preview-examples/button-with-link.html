<!DOCTYPE html>
<html lang="en" data-ix-theme="classic" data-ix-color-schema="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Button with link example</title>
    <script type="module" crossorigin src="../assets/button-with-link-V6u4kVRP.js"></script>
    <link rel="modulepreload" crossorigin href="../assets/global-Bs2gnYtf.js">
    <link rel="modulepreload" crossorigin href="../assets/init-D-m7DTfL.js">
    <link rel="modulepreload" crossorigin href="../assets/ix-icon.entry-BZjGqYSf.js">
    <link rel="modulepreload" crossorigin href="../assets/index-_MTu4qkX.js">
    <link rel="stylesheet" crossorigin href="../assets/global-D8t5uNhS.css">
    <link rel="stylesheet" crossorigin href="../assets/button-with-icon-BCumNLs0.css">
  </head>

  <body>
    <div style="padding: 2rem; max-width: 800px">
      <h2>Button Link Examples</h2>

      <div style="margin-bottom: 1rem">
        <h3>Basic Link Buttons</h3>
        <ix-button href="https://siemens.com">Visit Siemens</ix-button>
        <ix-button
          href="https://siemens.com"
          target="_blank"
          rel="noopener noreferrer"
        >
          Open in New Tab
        </ix-button>
        <ix-button href="/dashboard">Dashboard</ix-button>
      </div>

      <div style="margin-bottom: 1rem">
        <h3>Styled Link Buttons</h3>
        <ix-button href="https://siemens.com" variant="primary"
          >Primary Link</ix-button
        >
        <ix-button href="https://siemens.com" variant="secondary"
          >Secondary Link</ix-button
        >
        <ix-button href="https://siemens.com" variant="danger-primary"
          >Danger Link</ix-button
        >
      </div>

      <div style="margin-bottom: 1rem">
        <h3>Secondary and Tertiary Links</h3>
        <ix-button href="https://siemens.com" variant="secondary"> Secondary Link </ix-button>
        <ix-button href="https://siemens.com" variant="tertiary"> Tertiary Link </ix-button>
      </div>

      <div style="margin-bottom: 1rem">
        <h3>Icon Links</h3>
        <ix-button href="https://siemens.com" icon="home"> Home </ix-button>
        <ix-button
          href="https://siemens.com"
          target="_blank"
          icon-right="open-external"
        >
          External
        </ix-button>
      </div>

      <div style="margin-bottom: 1rem">
        <h3>Disabled Link</h3>
        <ix-button
          href="https://siemens.com"
          class="ix-button ix-button--disabled"
          disabled
        >
          Disabled Link
        </ix-button>
      </div>

      <div style="margin-bottom: 1rem">
        <h3>Comparison</h3>
        <button class="ix-button">Regular Button</button>
        <ix-button href="#section" class="ix-button">Link Button</ix-button>
      </div>
    </div>
  </body>
</html>
