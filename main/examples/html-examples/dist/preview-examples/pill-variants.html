<!DOCTYPE html>
<html lang="en" data-ix-theme="classic" data-ix-color-schema="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pill variant examples</title>
    <script type="module" crossorigin src="../assets/pill-variants-GMMUmx9e.js"></script>
    <link rel="modulepreload" crossorigin href="../assets/global-BRajFsjN.js">
    <link rel="modulepreload" crossorigin href="../assets/init-UuCsUrVQ.js">
    <link rel="modulepreload" crossorigin href="../assets/ix-icon.entry-mbZpNjhg.js">
    <link rel="modulepreload" crossorigin href="../assets/index-_MTu4qkX.js">
    <link rel="stylesheet" crossorigin href="../assets/global-D8t5uNhS.css">
    <link rel="stylesheet" crossorigin href="../assets/pill-variants-BtFAxUKh.css">
  </head>
  <body>
    <ix-layout-grid>
      <ix-row>
        <ix-col>
          <ix-pill variant="danger" icon="info">Danger</ix-pill>
        </ix-col>
        <ix-col>
          <ix-pill variant="danger" outline icon="info">Danger</ix-pill>
        </ix-col>
      </ix-row>

      <ix-row>
        <ix-col>
          <ix-pill variant="warning" icon="info">Warning</ix-pill>
        </ix-col>
        <ix-col>
          <ix-pill variant="warning" outline icon="info">Warning</ix-pill>
        </ix-col>
      </ix-row>

      <ix-row>
        <ix-col>
          <ix-pill variant="caution" icon="info">Caution</ix-pill>
        </ix-col>
        <ix-col>
          <ix-pill variant="caution" outline icon="info">Caution</ix-pill>
        </ix-col>
      </ix-row>

      <ix-row>
        <ix-col>
          <ix-pill variant="information" icon="info">Information</ix-pill>
        </ix-col>
        <ix-col>
          <ix-pill variant="information" outline icon="info"
            >Information</ix-pill
          >
        </ix-col>
      </ix-row>

      <ix-row>
        <ix-col>
          <ix-pill variant="accent" icon="info">Accent</ix-pill>
        </ix-col>
        <ix-col>
          <ix-pill variant="accent" outline icon="info">Accent</ix-pill>
        </ix-col>
      </ix-row>

      <ix-row>
        <ix-col>
          <ix-pill variant="critical" icon="info">Critical</ix-pill>
        </ix-col>
        <ix-col>
          <ix-pill variant="critical" outline icon="info">Critical</ix-pill>
        </ix-col>
      </ix-row>

      <ix-row>
        <ix-col>
          <ix-pill variant="success" icon="info">Success</ix-pill>
        </ix-col>
        <ix-col>
          <ix-pill variant="success" outline icon="info">Success</ix-pill>
        </ix-col>
      </ix-row>

      <ix-row>
        <ix-col>
          <ix-pill variant="neutral" icon="info">Neutral</ix-pill>
        </ix-col>
        <ix-col>
          <ix-pill variant="neutral" outline icon="info">Neutral</ix-pill>
        </ix-col>
      </ix-row>

      <ix-row>
        <ix-col>
          <ix-pill
            variant="custom"
            pill-color="var(--si-sys-color-text-inverse)"
            background="var(--si-sys-color-background-accent-hover)"
            icon="info"
          >
            Custom
          </ix-pill>
        </ix-col>
        <ix-col>
          <ix-pill
            variant="custom"
            outline
            pill-color="var(--si-sys-color-text-accent-hover)"
            background="var(--si-sys-color-background-accent-hover)"
            icon="info"
          >
            Custom
          </ix-pill>
        </ix-col>
      </ix-row>
    </ix-layout-grid>
  </body>
</html>
