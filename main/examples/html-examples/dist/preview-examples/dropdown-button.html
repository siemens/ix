<!DOCTYPE html>
<html lang="en" data-ix-theme="classic" data-ix-color-schema="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dropdown button example</title>
    <script type="module" crossorigin src="../assets/dropdown-button-C-UWMRNG.js"></script>
    <link rel="modulepreload" crossorigin href="../assets/global-43rhC1fd.js">
    <link rel="modulepreload" crossorigin href="../assets/init-DTq97SR9.js">
    <link rel="modulepreload" crossorigin href="../assets/ix-icon.entry-M3WXBi9P.js">
    <link rel="modulepreload" crossorigin href="../assets/index-lQqpelqO.js">
    <link rel="stylesheet" crossorigin href="../assets/global-D8t5uNhS.css">
    <link rel="stylesheet" crossorigin href="../assets/dropdown-button-BKwGbDT1.css">
  </head>
  <body>
    <div class="dropdown-button">
      <ix-dropdown-button label="Primary dropdown" icon="checkboxes">
        <ix-dropdown-item label="Item 1"></ix-dropdown-item>
        <ix-dropdown-item label="Item 2"></ix-dropdown-item>
      </ix-dropdown-button>
      <ix-dropdown-button
        variant="subtle-primary"
        label="Subtle primary dropdown"
        icon="checkboxes"
      >
        <ix-dropdown-item label="Item 1"></ix-dropdown-item>
        <ix-dropdown-item label="Item 2"></ix-dropdown-item>
      </ix-dropdown-button>
      <ix-dropdown-button
        variant="tertiary"
        label="Tertiary dropdown"
        icon="checkboxes"
      >
        <ix-dropdown-item label="Item 1"></ix-dropdown-item>
        <ix-dropdown-item label="Item 2"></ix-dropdown-item>
      </ix-dropdown-button>
      <ix-dropdown-button label="Disabled dropdown" disabled icon="checkboxes">
      </ix-dropdown-button>
    </div>
  </body>
</html>
