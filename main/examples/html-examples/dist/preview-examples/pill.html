<!DOCTYPE html>
<html lang="en" data-ix-theme="classic" data-ix-color-schema="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pill example</title>
    <script type="module" crossorigin src="../assets/pill-CkT7q8Ye.js"></script>
    <link rel="modulepreload" crossorigin href="../assets/preload-helper-UZRgTS1n.js">
    <link rel="modulepreload" crossorigin href="../assets/index-CgUi6DzV-fQJuTF8s.js">
    <link rel="modulepreload" crossorigin href="../assets/global-BFmC_PbI.js">
    <link rel="modulepreload" crossorigin href="../assets/index-DCCkv1ZQ-DZnlOMEt.js">
    <link rel="modulepreload" crossorigin href="../assets/ix-icon.entry-CGiLGChb.js">
    <link rel="modulepreload" crossorigin href="../assets/index-MpHERktc.js">
    <link rel="modulepreload" crossorigin href="../assets/init-C5YnK6N4.js">
    <link rel="stylesheet" crossorigin href="../assets/global-BOgBuYcl.css">
    <link rel="stylesheet" crossorigin href="../assets/pill-DXxFlxnT.css">
  </head>
  <body>
    <ix-pill
      variant="custom"
      pill-color="var(--si-sys-color-text-inverse)"
      background="var(--si-sys-color-background-accent-hover)"
      >Label</ix-pill
    >

    <ix-pill tooltip-text="Custom tooltip text">Label</ix-pill>
    <ix-pill class="styled">Label</ix-pill>

    <ix-pill icon="star">Label</ix-pill>
    <ix-pill icon="star" aria-label="Featured"></ix-pill>
    <ix-pill icon="star" class="styled">Label</ix-pill>
    <ix-pill variant="accent" outline align-left icon="star" class="styled"
      >Label</ix-pill
    >

    <ix-pill variant="danger">Label</ix-pill>
    <ix-pill variant="danger" class="styled">Label</ix-pill>

    <ix-pill variant="danger" icon="star">Label</ix-pill>
    <ix-pill variant="danger" icon="star" class="styled">Label</ix-pill>
    <ix-pill variant="danger" align-left icon="star" class="styled">
      Label
    </ix-pill>
    <ix-pill icon="star" class="styled-ellipsis-4">Label</ix-pill>
    <ix-pill variant="accent" outline icon="star" class="styled-ellipsis-4"
      >Label</ix-pill
    >
    <ix-pill class="styled-ellipsis-3">Label</ix-pill>
    <ix-pill variant="accent" outline class="styled-ellipsis-3">Label</ix-pill>
  </body>
</html>
