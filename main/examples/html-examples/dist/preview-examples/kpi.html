<!DOCTYPE html>
<html lang="en" data-ix-theme="classic" data-ix-color-schema="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kpi example</title>
    <script type="module" crossorigin src="../assets/global-EB1NlL0D.js"></script>
    <script type="module" crossorigin src="../assets/init-BUp9w8W6.js"></script>
    <link rel="stylesheet" crossorigin href="../assets/global-D8t5uNhS.css">
    <link rel="stylesheet" crossorigin href="../assets/kpi-DoX0_las.css">
  </head>
  <body>
    <div class="example">
      <ix-kpi label="Motor speed" value="Nominal"></ix-kpi>
      <ix-kpi label="Motor speed" value="122.6" unit="rpm"></ix-kpi>
      <ix-kpi label="Motor speed" value="122.6" state="warning"></ix-kpi>
      <ix-kpi label="Motor speed" value="122.6" state="danger"></ix-kpi>
      <ix-kpi label="Motor speed" value="122.6" state="caution"></ix-kpi>
      <ix-kpi label="Motor speed" value="122.6" state="success"></ix-kpi>
      <ix-kpi label="Motor speed" value="122.6" state="information"></ix-kpi>
      <ix-kpi label="Motor speed" value="122.6" state="accent"></ix-kpi>
      <ix-kpi label="Motor speed" value="122.6" state="critical"></ix-kpi>

      <ix-kpi
        label="Motor speed"
        value="Nominal"
        orientation="vertical"
      ></ix-kpi>
      <ix-kpi
        label="Motor speed"
        value="122.6"
        unit="rpm"
        state="danger"
        orientation="vertical"
      ></ix-kpi>
    </div>
  </body>
</html>
