<!DOCTYPE html>
<html lang="en" data-ix-theme="classic" data-ix-color-schema="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Icon notification list example</title>
    <script type="module" crossorigin src="../assets/preload-helper-UZRgTS1n.js"></script>
    <script type="module" crossorigin src="../assets/index-CgUi6DzV-fQJuTF8s.js"></script>
    <script type="module" crossorigin src="../assets/global-BFmC_PbI.js"></script>
    <script type="module" crossorigin src="../assets/index-DCCkv1ZQ-DZnlOMEt.js"></script>
    <script type="module" crossorigin src="../assets/init-C5YnK6N4.js"></script>
    <link rel="stylesheet" crossorigin href="../assets/global-BOgBuYcl.css">
    <link rel="stylesheet" crossorigin href="../assets/generic-list-notification-icon-CHDuTP6r.css">
  </head>
  <body>
    <ix-list class="notification-icon-list">
      <ix-list-item aria-label="Notification: This is the first title">
        <div class="notification-icon-item">
          <ix-badge
            type="status-icon"
            variant="info"
            role="img"
            aria-label="Information"
          ></ix-badge>
          <div class="notification-icon-text">
            <ix-typography format="body" text-color="soft">
              <time>Just now</time>
            </ix-typography>
            <ix-typography format="body" bold>
              This is the first title
            </ix-typography>
            <ix-typography format="body">
              This is a description of the first item
            </ix-typography>
          </div>
        </div>
      </ix-list-item>

      <ix-list-item aria-label="Notification: This is the second title">
        <div class="notification-icon-item">
          <ix-badge
            type="status-icon"
            variant="info"
            role="img"
            aria-label="Information"
          ></ix-badge>
          <div class="notification-icon-text">
            <ix-typography format="body" text-color="soft">
              <time>5 minutes ago</time>
            </ix-typography>
            <ix-typography format="body" bold>
              This is the second title
            </ix-typography>
            <ix-typography format="body">
              This is a description of the second item
            </ix-typography>
          </div>
        </div>
      </ix-list-item>

      <ix-list-item aria-label="Notification: This is the third title">
        <div class="notification-icon-item">
          <ix-badge
            type="status-icon"
            variant="info"
            role="img"
            aria-label="Information"
          ></ix-badge>
          <div class="notification-icon-text">
            <ix-typography format="body" text-color="soft">
              <time>Yesterday</time>
            </ix-typography>
            <ix-typography format="body" bold>
              This is the third title
            </ix-typography>
            <ix-typography format="body">
              This is a description of the third item
            </ix-typography>
          </div>
        </div>
      </ix-list-item>
    </ix-list>
  </body>
</html>
