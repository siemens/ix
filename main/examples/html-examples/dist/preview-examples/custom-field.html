<!DOCTYPE html>
<html lang="en" data-ix-theme="classic" data-ix-color-schema="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom field example</title>
    <script type="module" crossorigin src="../assets/custom-field-CI7JJUd4.js"></script>
    <link rel="modulepreload" crossorigin href="../assets/preload-helper-UZRgTS1n.js">
    <link rel="modulepreload" crossorigin href="../assets/index-CgUi6DzV-fQJuTF8s.js">
    <link rel="modulepreload" crossorigin href="../assets/global-BFmC_PbI.js">
    <link rel="modulepreload" crossorigin href="../assets/index-DCCkv1ZQ-DZnlOMEt.js">
    <link rel="modulepreload" crossorigin href="../assets/ix-icon.entry-CGiLGChb.js">
    <link rel="modulepreload" crossorigin href="../assets/index-MpHERktc.js">
    <link rel="modulepreload" crossorigin href="../assets/init-C5YnK6N4.js">
    <link rel="stylesheet" crossorigin href="../assets/global-BOgBuYcl.css">
  </head>
  <body>
    <ix-custom-field helper-text="Choose file">
      <ix-input value="No file chosen" readonly></ix-input>
      <ix-icon-button icon="open-file" variant="subtle-primary"></ix-icon-button>
      <input id="file-upload" type="file" style="display: none" />
    </ix-custom-field>

    <script>
      document.querySelector('ix-icon-button').addEventListener('click', () => {
        document.querySelector('#file-upload').click();
      });
      document.querySelector('#file-upload').addEventListener('input', (e) => {
        const fileName = e.target.files[0]?.name;
        document.querySelector('ix-input').value = fileName || 'No file chosen';
      });
    </script>
  </body>
</html>
