<!DOCTYPE html>
<html lang="en" data-ix-theme="community" data-ix-color-schema="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat user message example</title>
    <script type="module" crossorigin src="../assets/chat-user-message-XKYFZjU_.js"></script>
    <link rel="modulepreload" crossorigin href="../assets/preload-helper-UZRgTS1n.js">
    <link rel="modulepreload" crossorigin href="../assets/index-CgUi6DzV-CwYAT1Wh.js">
    <link rel="modulepreload" crossorigin href="../assets/global-D7nbPyh0.js">
    <link rel="modulepreload" crossorigin href="../assets/index-DCCkv1ZQ-DZnlOMEt.js">
    <link rel="modulepreload" crossorigin href="../assets/ix-icon.entry-CGiLGChb.js">
    <link rel="modulepreload" crossorigin href="../assets/index-MpHERktc.js">
    <link rel="modulepreload" crossorigin href="../assets/init-D6_1ueEi.js">
    <link rel="stylesheet" crossorigin href="../assets/global-eMBUmR7W.css">
  </head>
  <body>
    <ix-chat class="chat-example__chat">
      <ix-chat-user-message message="Summarize the attached shift report.">
        <ix-chat-attachment
          slot="attachments"
          file-name="shift_report.pdf"
          icon="pdf-document"
          hide-remove-button
        ></ix-chat-attachment>
        <ix-chat-attachment
          slot="attachments"
          file-name="operator_notes.txt"
          icon="txt-document"
          hide-remove-button
        ></ix-chat-attachment>
        <ix-icon-button
          slot="actions"
          aria-label="Copy message"
          icon="copy"
          size="24"
          variant="subtle-tertiary"
        ></ix-icon-button>
        <ix-icon-button
          slot="actions"
          aria-label="Edit message"
          icon="pen"
          size="24"
          variant="subtle-tertiary"
        ></ix-icon-button>
        <ix-icon-button
          slot="actions"
          aria-label="Show more actions"
          icon="more-menu"
          size="24"
          variant="subtle-tertiary"
        ></ix-icon-button>
      </ix-chat-user-message>
    </ix-chat>

  </body>
</html>
