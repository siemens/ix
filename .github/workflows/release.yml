name: Release

on:
  push:
    branches:
      - main
      - 'release-5.*.*'

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  # Runs dependency install scripts and the build without write or OIDC permissions.
  build:
    if: ${{ github.repository == 'siemens/ix' }}
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/workflows/actions/turbo

      - name: Build
        run: pnpm build --cache-dir=.turbo --force

      # Only generated build outputs. Manifests (package.json) and other tracked files come from the
      # release job's checkout, so the build job cannot inject lifecycle scripts into the publish step.
      - name: Upload build outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-packages
          path: |
            packages/core/dist
            packages/core/components
            packages/core/loader
            packages/core/hydrate
            packages/core/api-docs
            packages/core/component-doc.json
            packages/angular/dist
            packages/react/dist
            packages/vue/dist
            packages/aggrid/dist
            packages/echarts/dist
          if-no-files-found: error
          retention-days: 1

  # Holds the write and OIDC permissions; runs no install scripts and no build.
  release:
    if: ${{ github.repository == 'siemens/ix' }}
    name: Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        name: Install pnpm
        with:
          run_install: false

      - name: Setup Node.js environment
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: './package.json'

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download build outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-packages
          path: packages

      - name: Upgrade npm for OIDC support
        run: npm install -g npm@11.21.0 --no-man

      - name: Select npm publish command
        id: publish-command
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            echo "command=pnpm ci:publish" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" =~ ^release-5\.[0-9]+\.[0-9]+$ ]]; then
            echo "command=pnpm ci:publish --tag v5-lts" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No npm dist-tag configured for branch $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@e0145edc7d9d8679003495b11f87bd8ef63c0cba
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          publish: ${{ steps.publish-command.outputs.command }}
          version: pnpm ci:version
