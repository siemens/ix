name: Pull Request

on:
  pull_request:
    branches-ignore:
      - 'changeset-release/main'
    types:
      - opened
      - reopened
      - synchronize
    paths-ignore:
      - '**/*.md'

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # Builds, installs and every turbo invocation run on the host runner so all jobs
  # share one cache version and one hash space. Only browser-driven commands are
  # executed inside the pinned Playwright image, see actions/playwright-container.
  changes:
    runs-on: ubuntu-latest
    outputs:
      core_any_changed: ${{ steps.changes.outputs.core_any_changed }}
      core_all_changed_files: ${{ steps.changes.outputs.core_all_changed_files }}
      aggrid_any_changed: ${{ steps.changes.outputs.aggrid_any_changed }}
      echarts_any_changed: ${{ steps.changes.outputs.echarts_any_changed }}
      docs_any_changed: ${{ steps.changes.outputs.docs_any_changed }}
      unittests_any_changed: ${{ steps.changes.outputs.unittests_any_changed }}
      accessibility_any_changed: ${{ steps.changes.outputs.accessibility_any_changed }}
      visual_testing_any_changed: ${{ steps.changes.outputs.visual_testing_any_changed }}
      memlab_any_changed: ${{ steps.changes.outputs.memlab_any_changed }}
      ci_any_changed: ${{ steps.changes.outputs.ci_any_changed }}
    steps:
      - uses: actions/checkout@v4
      - name: Track changes between commits
        id: changes
        uses: tj-actions/changed-files@2f7c5bfce28377bc069a65ba478de0a74aa0ca32
        with:
          files_yaml: |
            core:
              - packages/core/**
            aggrid:
              - packages/aggrid/**
            echarts:
              - packages/echarts/**
            docs:
              - packages/documentation/**
              - packages/example-styles/**
              - packages/html-test-app/**
              - packages/angular-test-app/**
              - packages/react-test-app/**
              - packages/vue-test-app/**
            unittests:
              - packages/core/**
              - packages/angular/**
              - packages/react/**
              - packages/vue/**
              - packages/angular-test-app/**
              - packages/react-test-app/**
              - packages/vue-test-app/**
            accessibility:
              - packages/storybook-docs/**
              - packages/core/**
            visual_testing:
              - testing/visual-testing/**
            memlab:
              - testing/performance-memlab/**
            ci:
              - .github/workflows/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/workflows/actions/turbo
        with:
          save-cache: 'true'

      - name: Build
        run: pnpm build --cache-dir=.turbo

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.run_attempt }}
          path: ./tooling/oss-clearing/sboms/

      - name: Lint
        run: pnpm lint

      - name: Check for local development changes
        run: ./scripts/lint-build.sh

      - name: Documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation-${{ github.run_attempt }}
          path: ./packages/documentation/build

  visual-testing-core:
    if: ${{ needs.changes.outputs.core_any_changed == 'true' || needs.changes.outputs.visual_testing_any_changed == 'true' || needs.changes.outputs.ci_any_changed == 'true' || github.event.pull_request.user.login == 'dependabot[bot]' }}
    needs: [build, changes]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/actions/turbo
      - uses: ./.github/workflows/actions/visual-regression
        with:
          projectName: 'visual-testing'
          projectPath: './testing/visual-testing/blob-report/'
          artifactName: 'visual-testing'
          shardIndex: '${{ matrix.shardIndex }}'
          shardTotal: '${{ matrix.shardTotal }}'

  merge-core-reports:
    if: failure()
    needs: [visual-testing-core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/actions/turbo
      - uses: ./.github/workflows/actions/merge-reports
        with:
          projectName: 'visual-testing'
          artifactName: 'visual-testing'
          blobPattern: 'visual-testing-blob-report-*'

  visual-testing-aggrid:
    if: ${{ needs.changes.outputs.core_any_changed == 'true' || needs.changes.outputs.aggrid_any_changed == 'true' || needs.changes.outputs.ci_any_changed == 'true' || github.event.pull_request.user.login == 'dependabot[bot]' }}
    needs: [build, changes]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/actions/turbo
      - uses: ./.github/workflows/actions/visual-regression
        with:
          projectName: '@siemens/ix-aggrid'
          artifactName: 'aggrid'
          projectPath: './packages/aggrid/playwright-report/'

  visual-testing-echarts:
    if: ${{ needs.changes.outputs.core_any_changed == 'true' || needs.changes.outputs.echarts_any_changed == 'true' || needs.changes.outputs.ci_any_changed == 'true' || github.event.pull_request.user.login == 'dependabot[bot]' }}
    needs: [build, changes]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/actions/turbo
      - uses: ./.github/workflows/actions/visual-regression
        with:
          projectName: '@siemens/ix-echarts'
          artifactName: 'echarts'
          projectPath: './packages/echarts/playwright-report/'

  unit:
    if: ${{ needs.changes.outputs.unittests_any_changed == 'true' || needs.changes.outputs.ci_any_changed == 'true' || github.event.pull_request.user.login == 'dependabot[bot]' }}
    needs: [build, changes]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            packages: '@siemens/ix'
          - group: angular
            packages: 'angular-test-app angular-standalone-test-app @siemens/ix-angular'
          - group: react-vue
            packages: 'react-test-app @siemens/ix-react vue-test-app @siemens/ix-vue'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/actions/turbo
      - uses: ./.github/workflows/actions/unit
        with:
          packages: ${{ matrix.packages }}

  accessibility:
    if: ${{ needs.changes.outputs.core_any_changed == 'true' || needs.changes.outputs.accessibility_any_changed == 'true' || needs.changes.outputs.ci_any_changed == 'true' || github.event.pull_request.user.login == 'dependabot[bot]' }}
    needs: [build, changes]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/actions/turbo
      - uses: ./.github/workflows/actions/storybook

  unit-memlab:
    if: ${{ needs.changes.outputs.unittests_any_changed == 'true' || needs.changes.outputs.memlab_any_changed == 'true' || needs.changes.outputs.ci_any_changed == 'true' || github.event.pull_request.user.login == 'dependabot[bot]' }}
    needs: [build, changes]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/actions/turbo

      - name: Test
        run: |
          pnpm dlx puppeteer browsers install chrome@127.0.6533.88
          pnpm turbo run test.memlab --filter=performance-memlab --cache-dir=.turbo
