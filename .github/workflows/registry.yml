name: Deploy registry

on:
  push:
    branches:
      - main
      - 'release-registry/**'
    # paths:
    #   - 'packages/**'
    #   - 'blocks/**'
    #   - 'examples/**'
    #   - 'tooling/registry/**'
    #   - '.github/workflows/registry.yml'
  workflow_dispatch:
    inputs:
      registry_name:
        description: 'Registry name to deploy (defaults to the selected ref name when empty)'
        required: false
        type: string

permissions:
  contents: write

env:
  CORPORATE_THEME_TOKEN: ${{ secrets.CORPORATE_THEME_TOKEN }}
  CORPORATE_THEME_VERSION: ${{ vars.CORPORATE_THEME_VERSION }}

jobs:
  build-and-deploy:
    concurrency: ci-registry-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check for gh-pages branch
        id: pages-branch
        run: |
          set +e
          OUTPUT="$(git ls-remote --exit-code --heads origin refs/heads/gh-pages 2>&1)"
          STATUS=$?
          set -e

          case "${STATUS}" in
            0)
              echo "exists=true" >> "$GITHUB_OUTPUT"
              ;;
            2)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "${OUTPUT}" >&2
              echo "Unable to determine whether the remote gh-pages branch exists." >&2
              exit "${STATUS}"
              ;;
          esac

      - name: Checkout gh-pages
        if: steps.pages-branch.outputs.exists == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: gh-pages
          path: .gh-pages

      - name: Initialize empty Pages state
        if: steps.pages-branch.outputs.exists == 'false'
        run: mkdir -p ./.gh-pages

      - uses: ./.github/workflows/actions/turbo

      - name: Determine deployment metadata
        id: deploy-meta
        env:
          REGISTRY_NAME: ${{ inputs.registry_name }}
        run: |
          REF_NAME="${REGISTRY_NAME:-${GITHUB_REF_NAME}}"
          VERSION="$(pnpm --filter registry exec tsx src/deployment-policy.ts resolve-version "${REF_NAME}")"

          echo "registry_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "registry_path_prefix=${VERSION}" >> "$GITHUB_OUTPUT"

          echo "Deploying registry version '${VERSION}'"

      - name: Debug deployment metadata
        run: |
          echo "GITHUB_REF=${GITHUB_REF}"
          echo "GITHUB_REF_NAME=${GITHUB_REF_NAME}"
          echo "REGISTRY_NAME=${{ inputs.registry_name }}"
          echo "registry_version=${{ steps.deploy-meta.outputs.registry_version }}"
          echo "registry_path_prefix=${{ steps.deploy-meta.outputs.registry_path_prefix }}"

      - name: Build
        env:
          REGISTRY_VERSION: ${{ steps.deploy-meta.outputs.registry_version }}
          REGISTRY_PATH_PREFIX: ${{ steps.deploy-meta.outputs.registry_path_prefix }}
          REGISTRY_LATEST_TAG: ${{ steps.deploy-meta.outputs.registry_version }}
        run: pnpm build --filter registry --cache-dir=.turbo

      - name: Debug dist artifacts
        run: |
          echo "== tooling/registry/dist top-level =="
          ls -la ./tooling/registry/dist || true
          echo "== key dist json files =="
          ls -la ./tooling/registry/dist/registry.json || true
          ls -la ./tooling/registry/dist/llms.txt || true
          echo "== first 40 files under dist =="
          find ./tooling/registry/dist -type f | sort | head -n 40 || true

      - name: Prepare merged deploy folder
        run: |
          rm -rf ./tooling/registry/deploy

          pnpm --filter registry exec tsx src/merge-pages-registry.ts \
            --dist-dir ./dist \
            --pages-dir ../../.gh-pages \
            --out-dir ./deploy \
            --version "${{ steps.deploy-meta.outputs.registry_version }}"

      - name: Debug merged deploy folder
        run: |
          echo "== deploy top-level =="
          ls -la ./tooling/registry/deploy || true
          echo "== key deploy json files =="
          ls -la ./tooling/registry/deploy/registry.json || true
          ls -la ./tooling/registry/deploy/llms.txt || true
          ls -la ./tooling/registry/deploy/${{ steps.deploy-meta.outputs.registry_version }}/llms.txt || true
          echo "== first 80 files under deploy =="
          find ./tooling/registry/deploy -type f | sort | head -n 80 || true

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          folder: ./tooling/registry/deploy
          target-folder: .
          clean: true

      - name: Debug post-failure context
        if: failure()
        run: |
          echo "== gh-pages checkout =="
          ls -la ./.gh-pages || true
          echo "== deploy folder (on failure) =="
          ls -la ./tooling/registry/deploy || true
