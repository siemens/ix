name: 'Visual regression tests'
description: 'Visual regression tests'
inputs:
  projectName:
    description: 'Name of the project to run tests for'
    required: true
  artifactName:
    description: 'Name of the artifact to upload'
    required: true
  projectPath:
    description: 'Path to the project blob reports'
    required: false
    default: ''
  shardIndex:
    description: 'Shard index for parallel test execution'
    required: false
    default: ''
  shardTotal:
    description: 'Total number of shards for parallel test execution'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Build
      shell: bash
      env:
        PROJECT_NAME: ${{ inputs.projectName }}
      run: pnpm run build --cache-dir=.turbo --filter "$PROJECT_NAME..."

    - name: Resolve Playwright arguments
      id: playwright-args
      shell: bash
      env:
        SHARD_INDEX: ${{ inputs.shardIndex }}
        SHARD_TOTAL: ${{ inputs.shardTotal }}
      run: |
        if [ -n "$SHARD_INDEX" ] && [ -n "$SHARD_TOTAL" ]; then
          echo "value=--shard=$SHARD_INDEX/$SHARD_TOTAL" >> "$GITHUB_OUTPUT"
        else
          echo "value=" >> "$GITHUB_OUTPUT"
        fi

    - name: Test
      uses: ./.github/workflows/actions/playwright-container
      with:
        run: pnpm --filter '${{ inputs.projectName }}' run visual-regression ${{ steps.playwright-args.outputs.value }}

    - uses: actions/upload-artifact@v4
      if: always() && inputs.shardIndex != '' && inputs.projectPath != ''
      with:
        name: ${{ inputs.artifactName }}-blob-report-${{ inputs.shardIndex }}
        path: ${{ inputs.projectPath }}
        retention-days: 1

    - uses: actions/upload-artifact@v4
      if: failure() && inputs.shardIndex == '' && inputs.projectPath != ''
      with:
        name: ${{ inputs.artifactName }}-html-report--attempt-${{ github.run_attempt }}
        path: ${{ inputs.projectPath }}
        retention-days: 1
