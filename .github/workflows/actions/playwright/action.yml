name: 'Playwright browser setup'
description: 'Cache the shared Playwright Chromium browser and install system dependencies'
inputs:
  install-deps:
    description: 'Install Chromium system dependencies on the current runner'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    - name: Cache Playwright browser
      id: playwright-cache
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Install Chromium
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm --filter visual-testing exec playwright install chromium

    - name: Install Chromium system dependencies
      if: inputs.install-deps == 'true'
      shell: bash
      run: pnpm --filter visual-testing exec playwright install-deps chromium
