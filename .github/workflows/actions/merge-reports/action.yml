name: 'Merge Reports'
description: 'Merge Playwright blob reports into HTML report'
inputs:
  projectName:
    description: 'Name of the project for artifact naming'
    required: true
  artifactName:
    description: 'Name of the artifact to upload'
    required: true
  blobPattern:
    description: 'Pattern to match blob report artifacts'
    required: true
  outputPath:
    description: 'Path where the merged HTML report will be generated'
    required: false
    default: 'testing/visual-testing/playwright-report'
runs:
  using: 'composite'
  steps:
    - name: Download blob reports from GitHub Actions Artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        path: all-blob-reports
        pattern: ${{ inputs.blobPattern }}
        merge-multiple: true

    - name: Merge into HTML Report
      shell: bash
      env:
        PROJECT_NAME: ${{ inputs.projectName }}
      run: pnpm --filter $PROJECT_NAME exec playwright merge-reports --reporter html ../../all-blob-reports

    - name: Upload HTML report
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ inputs.artifactName }}-html-report--attempt-${{ github.run_attempt }}
        path: ${{ inputs.outputPath }}
        retention-days: 14
