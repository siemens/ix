name: 'Create SBOM'
description: 'Create SBOM'
runs:
  using: 'composite'
  steps:
    - name: Create SBOM
      run: pnpm build --filter oss-clearing
      shell: bash

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: sbom-${{ github.run_attempt }}
        path: |
          ./tooling/oss-clearing/sboms/
