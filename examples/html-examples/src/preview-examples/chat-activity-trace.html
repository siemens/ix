<!DOCTYPE html>
<html lang="en" data-ix-theme="classic" data-ix-color-schema="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat activity trace example</title>
    <script type="module">
      import { addIcons } from '@siemens/ix-icons';
      import {
        iconCogwheel,
        iconDocument,
        iconSearch,
      } from '@siemens/ix-icons/icons';

      addIcons({
        iconCogwheel,
        iconDocument,
        iconSearch,
      });
    </script>
  </head>
  <body>
    <ix-chat class="chat-example__chat">
      <ix-chat-ai-message>
        <ix-chat-activity-trace
          slot="trace"
          summary="Analyzed compressor data"
          expanded
        >
          <span slot="summary-meta">4 steps, 12 s</span>
          <ix-chat-trace-item label="Searched maintenance logs" icon="search">
            <ix-chat-trace-item-section heading="Asset">
              <ix-pill variant="neutral" outline>Compressor C-12</ix-pill>
            </ix-chat-trace-item-section>
            <ix-chat-trace-item-section heading="Output" collapsible>
              <p>Found 3 vibration alarms in the last 7 days.</p>
            </ix-chat-trace-item-section>
          </ix-chat-trace-item>
          <ix-chat-trace-item
            label="Read vibration-trend.csv"
            icon="document"
          ></ix-chat-trace-item>
          <ix-chat-trace-item
            label="Read service-schedule.xlsx"
            icon="document"
            state="failed"
          ></ix-chat-trace-item>
          <ix-chat-trace-item
            label="Stopped checking spare parts"
            icon="cogwheel"
            state="warning"
          ></ix-chat-trace-item>
        </ix-chat-activity-trace>
        <p>
          The compressor vibration is within the expected range. Schedule the
          next inspection during the Friday service window.
        </p>
      </ix-chat-ai-message>
    </ix-chat>

    <script type="module" src="./init.js"></script>
    <script type="module">
      await window.ixInitPromise;
    </script>
  </body>
</html>
