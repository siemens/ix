<!DOCTYPE html>
<html lang="en" data-ix-theme="classic" data-ix-color-schema="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTTP error pages example</title>
  </head>
  <body>
    <div
      style="display: flex; flex-direction: column; width: 100%; height: 100%"
    >
      <ix-select id="error-code" label="HTTP error code" value="404">
        <ix-select-item label="400 Bad Request" value="400"></ix-select-item>
        <ix-select-item label="401 Unauthorized" value="401"></ix-select-item>
        <ix-select-item label="404 Not Found" value="404"></ix-select-item>
        <ix-select-item label="418 I'm a Teapot" value="418"></ix-select-item>
        <ix-select-item
          label="500 Internal Server Error"
          value="500"
        ></ix-select-item>
        <ix-select-item
          label="504 Gateway Timeout"
          value="504"
        ></ix-select-item>
      </ix-select>

      <ix-info-page id="error-page" title-text="">
        <img id="error-image" slot="image" width="260" height="196" alt="" />
      </ix-info-page>
    </div>

    <script type="module">
      const errorPages = {
        400: {
          title: '400 Bad Request',
          instructions:
            'Failed to process the request. Check your request and try again.',
          illustration: {
            alt: 'Bad Request',
            src: new URL(
              '../../../../packages/storybook-docs/src/stories/http-error-pages/document.svg',
              import.meta.url
            ).href,
          },
          actions: ['Go back', 'Open homepage'],
        },
        401: {
          title: '401 Unauthorized',
          instructions:
            'Authorization is required to access this page. Check your credentials and try again.',
          illustration: {
            alt: 'Unauthorized',
            src: new URL(
              '../../../../packages/storybook-docs/src/stories/http-error-pages/lock.svg',
              import.meta.url
            ).href,
          },
          actions: ['Go back', 'Log in'],
        },
        404: {
          title: '404 Not Found',
          instructions:
            'We are not able to find that page. It may have been deleted or moved.',
          illustration: {
            alt: 'Not Found',
            src: new URL(
              '../../../../packages/storybook-docs/src/stories/http-error-pages/magnifier.svg',
              import.meta.url
            ).href,
          },
          actions: ['Search app', 'Open homepage'],
        },
        418: {
          title: "418 I'm a Teapot",
          instructions:
            "The server refuses to brew coffee because, well... it's a teapot.",
          illustration: {
            alt: "I'm a Teapot",
            src: new URL(
              '../../../../packages/storybook-docs/src/stories/http-error-pages/teapot.svg',
              import.meta.url
            ).href,
          },
          actions: [],
        },
        500: {
          title: '500 Internal Server Error',
          instructions:
            'This page is not available right now. Try refreshing the page or try again later.',
          illustration: {
            alt: 'Internal Server Error',
            src: new URL(
              '../../../../packages/storybook-docs/src/stories/http-error-pages/plug.svg',
              import.meta.url
            ).href,
          },
          actions: ['Go back', 'Open homepage'],
        },
        504: {
          title: '504 Gateway Timeout',
          instructions:
            'The server is taking too long to respond. Try again or change your timeout settings.',
          illustration: {
            alt: 'Gateway Timeout',
            src: new URL(
              '../../../../packages/storybook-docs/src/stories/http-error-pages/hourglass.svg',
              import.meta.url
            ).href,
          },
          actions: ['Go back', 'Open homepage'],
        },
      };

      const select = document.querySelector('#error-code');
      const infoPage = document.querySelector('#error-page');
      const image = document.querySelector('#error-image');

      const showErrorPage = (code) => {
        const errorPage = errorPages[code];
        infoPage.setAttribute('title-text', errorPage.title);
        infoPage.setAttribute('instructions', errorPage.instructions);
        image.src = errorPage.illustration.src;
        image.alt = errorPage.illustration.alt;
        infoPage.querySelectorAll('[slot="actions"]').forEach((action) => {
          action.remove();
        });
        errorPage.actions.forEach((label, index) => {
          const button = document.createElement('ix-button');
          button.slot = 'actions';
          button.variant = index === 0 ? 'secondary' : 'primary';
          button.textContent = label;
          infoPage.append(button);
        });
      };

      select.addEventListener('valueChange', ({ detail }) => {
        showErrorPage(detail);
      });

      showErrorPage('404');
    </script>
    <script type="module" src="./init.js"></script>
  </body>
</html>
