<!doctype html>
<html dir="ltr" lang="en" data-ix-theme="classic" data-ix-color-schema="system">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0"
    />
    <meta name="ix:legacy-icons" content="false" />
    <title>Stencil Component Starter</title>
    <script type="module" src="./build/siemens-ix.esm.js"></script>
    <script nomodule src="./build/siemens-ix.js"></script>
    <link rel="stylesheet" href="./build/siemens-ix.css" />
    <script type="module">
      import { defineCustomElement } from '/node_modules/@siemens/ix-icons/components/ix-icon.js';
      import { addIcons } from '/node_modules/@siemens/ix-icons/dist/index.js';
      import * as icons from '/node_modules/@siemens/ix-icons/icons/index.mjs';

      defineCustomElement();

      /**
       * Preload all icons
       */
      addIcons(icons);
    </script>
  </head>
  <body>
    <div style="width: 400px; margin: 12px">
      <ix-list has-divider item-gap="0">
        <ix-list-item
          variant="ghost"
          icon="project"
          label="test"
        ></ix-list-item>
        <ix-list-item
          variant="ghost"
          icon="project"
          label="test 2"
        ></ix-list-item>
        <ix-list-item
          variant="ghost"
          icon="project"
          label="test 3"
        ></ix-list-item>
        <ix-list-item
          variant="ghost"
          icon="project"
          label="test 4"
        ></ix-list-item>
      </ix-list>
    </div>

    <div style="width: 400px; margin: 12px; margin-top: 40px">
      <ix-list draggable>
        <ix-list-item icon="project" label="test"></ix-list-item>
        <ix-list-item icon="project" label="test 2"></ix-list-item>
        <ix-list-item icon="project" label="test 3"></ix-list-item>
        <ix-list-item icon="project" label="test 4"></ix-list-item>
      </ix-list>
    </div>

    <div style="width: 400px; margin: 12px; margin-top: 40px">
      <ix-list>
        <ix-list-item checkbox icon="project" label="test"></ix-list-item>
        <ix-list-item checkbox icon="project" label="test 2"></ix-list-item>
        <ix-list-item checkbox icon="project" label="test 3"></ix-list-item>
        <ix-list-item checkbox icon="project" label="test 4"></ix-list-item>
      </ix-list>
    </div>

    <div style="width: 400px; margin: 12px; margin-top: 40px">
      <ix-list>
        <ix-list-item icon="project" label="test" action-on-hover>
          <div slot="action">
            <ix-icon-button
              icon="edit-document"
              variant="ghost"
            ></ix-icon-button>
            <ix-icon-button icon="trashcan" variant="ghost"></ix-icon-button>
          </div>
        </ix-list-item>
        <ix-list-item icon="project" label="test 2" action-on-hover>
          <div slot="action">
            <ix-icon-button
              icon="edit-document"
              variant="ghost"
            ></ix-icon-button>
            <ix-icon-button icon="trashcan" variant="ghost"></ix-icon-button>
          </div>
        </ix-list-item>
        <ix-list-item icon="project" label="test 3" action-on-hover>
          <div slot="action">
            <ix-icon-button
              icon="edit-document"
              variant="ghost"
            ></ix-icon-button>
            <ix-icon-button icon="trashcan" variant="ghost"></ix-icon-button>
          </div>
        </ix-list-item>
        <ix-list-item icon="project" label="test 4" action-on-hover>
          <div slot="action">
            <ix-icon-button
              icon="edit-document"
              variant="ghost"
            ></ix-icon-button>
            <ix-icon-button icon="trashcan" variant="ghost"></ix-icon-button>
          </div>
        </ix-list-item>
      </ix-list>
    </div>
  </body>
</html>
