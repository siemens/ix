<!doctype html>
<html dir="ltr" lang="en" data-ix-theme="classic" data-ix-color-schema="system">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0"
    />
    <meta name="ix:legacy-icons" content="false" />
    <title>Stencil Component Starter</title>
    <script type="module" src="./build/siemens-ix.esm.js"></script>
    <script nomodule src="./build/siemens-ix.js"></script>
    <link rel="stylesheet" href="./build/siemens-ix.css" />
    <script type="module">
      import { defineCustomElement } from '/node_modules/@siemens/ix-icons/components/ix-icon.js';
      import { addIcons } from '/node_modules/@siemens/ix-icons/dist/index.js';
      import * as icons from '/node_modules/@siemens/ix-icons/icons/index.mjs';

      defineCustomElement();

      /**
       * Preload all icons
       */
      addIcons(icons);
    </script>
  </head>
  <body>
    <ix-menu>
      <ix-menu-item notifications="999" home icon="home">Home</ix-menu-item>
      <ix-menu-item notifications="9" icon="globe">Normal tab</ix-menu-item>
      <ix-menu-item icon="star" disabled>Disabled tab</ix-menu-item>
      <ix-menu-item notifications="99" icon="star"
        >With other icon</ix-menu-item
      >
      <ix-menu-category notifications="999" icon="star" label="Category">
        <ix-menu-item notifications="9" icon="globe">Nested tab</ix-menu-item>
        <ix-menu-item icon="star">Another nested tab</ix-menu-item>
      </ix-menu-category>
      <ix-menu-item icon="globe" style="display: none">
        Should not be visible
      </ix-menu-item>
    </ix-menu>
  </body>
</html>
