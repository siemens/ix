<!DOCTYPE html>
<html lang="en" data-ix-theme="classic" data-ix-color-schema="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Time picker require confirmation example</title>
    <link rel="stylesheet" href="./time-picker-require-confirmation.css" />
  </head>
  <body>
    <div class="require-confirmation">
      <ix-toggle
        checked
        aria-label="Require confirmation"
        text-on="Require confirmation: on"
        text-off="Require confirmation: off"
      ></ix-toggle>
      <ix-typography class="description"></ix-typography>
      <ix-time-picker time="09:30" format="HH:mm"></ix-time-picker>
      <ix-typography format="label"
        >Emitted events (latest first)</ix-typography
      >
      <ul class="event-log"></ul>
    </div>

    <script>
      const descriptions = {
        off: 'timeChange is emitted for every picked value.',
        on: 'timeChange is emitted only when you click Confirm. Cancel discards the picked time and emits timeCancel.',
      };

      const component = document.querySelector('ix-time-picker');
      const description = document.querySelector('.description');
      const eventLog = document.querySelector('.event-log');
      let requireConfirmation = true;
      let events = [];

      function render() {
        description.textContent = requireConfirmation
          ? descriptions.on
          : descriptions.off;
        eventLog.replaceChildren(
          ...events.map((text) => {
            const item = document.createElement('li');
            item.textContent = text;
            return item;
          })
        );
      }

      document
        .querySelector('ix-toggle')
        .addEventListener('checkedChange', (event) => {
          requireConfirmation = event.detail;
          component.requireConfirmation = requireConfirmation;
          events = [];
          render();
        });

      ['timeChange', 'timeSelect', 'timeCancel'].forEach((name) =>
        component.addEventListener(name, (event) => {
          const detail = JSON.stringify(event.detail) ?? '';
          events = [`${name}: ${detail}`, ...events].slice(0, 5);
          render();
        })
      );

      render();
    </script>
    <script type="module" src="./init.js"></script>
  </body>
</html>
