<!DOCTYPE html>
<html lang="en" data-ix-theme="classic" data-ix-color-schema="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Date picker require confirmation example</title>
    <link rel="stylesheet" href="./date-picker-require-confirmation.css" />
  </head>
  <body>
    <div class="require-confirmation">
      <ix-toggle
        aria-label="Require confirmation"
        text-on="Require confirmation: on"
        text-off="Require confirmation: off"
      ></ix-toggle>
      <ix-typography class="description"></ix-typography>
      <ix-date-picker from="2026/10/05" to="2026/10/09"></ix-date-picker>
      <ix-typography format="label"
        >Emitted events (latest first)</ix-typography
      >
      <ul class="event-log"></ul>
    </div>

    <script>
      const descriptions = {
        off: 'dateChange and dateRangeChange are emitted for every picked date.',
        on: 'dateChange and dateRangeChange are emitted only when you click Confirm. Cancel discards the picked dates and emits dateCancel.',
      };

      const component = document.querySelector('ix-date-picker');
      const description = document.querySelector('.description');
      const eventLog = document.querySelector('.event-log');
      let requireConfirmation = false;
      let events = [];

      function render() {
        description.textContent = requireConfirmation
          ? descriptions.on
          : descriptions.off;
        eventLog.replaceChildren(
          ...events.map((text) => {
            const item = document.createElement('li');
            item.textContent = text;
            return item;
          })
        );
      }

      document
        .querySelector('ix-toggle')
        .addEventListener('checkedChange', (event) => {
          requireConfirmation = event.detail;
          component.requireConfirmation = requireConfirmation;
          events = [];
          render();
        });

      ['dateChange', 'dateRangeChange', 'dateSelect', 'dateCancel'].forEach(
        (name) =>
          component.addEventListener(name, (event) => {
            const detail = JSON.stringify(event.detail) ?? '';
            events = [`${name}: ${detail}`, ...events].slice(0, 5);
            render();
          })
      );

      render();
    </script>
    <script type="module" src="./init.js"></script>
  </body>
</html>
