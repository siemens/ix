<div style="display: flex; flex-direction: column; gap: 1rem">
  <div style="display: flex; gap: 2rem; flex-wrap: wrap">
    <div>
      <span style="margin-right: 0.5rem">Language:</span>
      <ix-select [value]="locale" (valueChange)="setLocale($event)">
        <ix-select-item
          *ngFor="let l of locales"
          [value]="l.value"
          [label]="l.label"
        ></ix-select-item>
      </ix-select>
    </div>
    <div>
      <span style="margin-right: 0.5rem">Format:</span>
      <ix-select [value]="format" (valueChange)="setFormat($event)">
        <ix-select-item
          *ngFor="let f of formats"
          [value]="f.value"
          [label]="f.label"
        ></ix-select-item>
      </ix-select>
    </div>
  </div>

  <ix-date-picker
    [locale]="locale"
    [format]="format"
    (dateChange)="onDateChange($event)"
    (dateRangeChange)="onDateChange($event)"
  ></ix-date-picker>

  <div
    style="
      padding: 0.75rem 1rem;
      border: 1px solid var(--theme-color-weak-bdr);
      border-radius: 4px;
      background: var(--theme-color-2);
      min-width: 320px;
    "
  >
    <div style="font-weight: 700; margin-bottom: 0.5rem">
      Last dateChange event
    </div>
    <ng-container *ngIf="lastEvent === null; else eventValues">
      <span style="color: var(--theme-color-soft-text)">
        Select a date to see event values
      </span>
    </ng-container>
    <ng-template #eventValues>
      <div
        *ngFor="
          let row of [
            { key: 'from', label: 'from', note: '(locale-aware)' },
            { key: 'to', label: 'to', note: '(locale-aware)' },
            { key: 'isoFrom', label: 'isoFrom', note: '(ISO 8601, stable)' },
            { key: 'isoTo', label: 'isoTo', note: '(ISO 8601, stable)' }
          ]
        "
        style="display: flex; gap: 0.5rem; align-items: baseline; padding: 2px 0"
      >
        <span
          style="
            font-weight: 600;
            min-width: 90px;
            display: inline-block;
            color: var(--theme-color-std-text);
          "
        >
          {{ row.label }}
        </span>
        <span
          style="font-family: monospace; color: var(--theme-color-primary)"
        >
          {{ lastEvent?.[row.key] ?? '—' }}
        </span>
        <span style="color: var(--theme-color-soft-text); font-size: 0.8em">
          {{ row.note }}
        </span>
      </div>
    </ng-template>
  </div>
</div>
