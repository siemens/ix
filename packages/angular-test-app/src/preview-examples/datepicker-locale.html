<ix-layout-grid>
  <ix-row>
    <ix-col>
      <span style="margin-right: 0.5rem">Language:</span>
      <ix-select [value]="locale" (valueChange)="setLocale($event)">
        <ix-select-item
          *ngFor="let l of locales"
          [value]="l.value"
          [label]="l.label"
        ></ix-select-item>
      </ix-select>
    </ix-col>
    <ix-col>
      <span style="margin-right: 0.5rem">Format:</span>
      <ix-select [value]="format" (valueChange)="setFormat($event)">
        <ix-select-item
          *ngFor="let f of formats"
          [value]="f.value"
          [label]="f.label"
        ></ix-select-item>
      </ix-select>
    </ix-col>
  </ix-row>

  <ix-row>
    <ix-col size="12">
      <ix-date-picker
        [locale]="locale"
        [format]="format"
        (dateChange)="onDateChange($event)"
        (dateRangeChange)="onDateChange($event)"
      ></ix-date-picker>
    </ix-col>
  </ix-row>

  <ix-row>
    <ix-col
      size="12"
      style="
        padding: 0.75rem 1rem;
        border: 1px solid var(--theme-color-weak-bdr);
        border-radius: 4px;
        background: var(--theme-color-2);
      "
    >
      <span style="display: block; font-weight: 700; margin-bottom: 0.5rem">
        Last date-picker event
      </span>
      <ng-container *ngIf="lastEvent === null; else eventValues">
        <span style="color: var(--theme-color-soft-text)">
          Select a date to see event values
        </span>
      </ng-container>
      <ng-template #eventValues>
        <ix-layout-grid no-margin>
          <ix-row
            *ngFor="
              let row of [
                { key: 'from', label: 'from', note: '(locale-aware)' },
                { key: 'to', label: 'to', note: '(locale-aware)' },
                { key: 'isoFrom', label: 'isoFrom', note: '(ISO 8601, stable)' },
                { key: 'isoTo', label: 'isoTo', note: '(ISO 8601, stable)' }
              ]
            "
          >
            <ix-col
              size="2"
              style="font-weight: 600; color: var(--theme-color-std-text)"
            >
              {{ row.label }}
            </ix-col>
            <ix-col style="font-family: monospace; color: var(--theme-color-primary)">
              {{ lastEvent?.[row.key] ?? '—' }}
            </ix-col>
            <ix-col style="color: var(--theme-color-soft-text); font-size: 0.8em">
              {{ row.note }}
            </ix-col>
          </ix-row>
        </ix-layout-grid>
      </ng-template>
    </ix-col>
  </ix-row>
</ix-layout-grid>
