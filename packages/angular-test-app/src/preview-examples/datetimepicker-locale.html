<ix-layout-grid>
  <ix-row>
    <ix-col size="12">
      <div style="display: flex; gap: 6rem; flex-wrap: wrap">
        <div>
          <span style="margin-right: 0.5rem">Language:</span>
          <ix-select [value]="locale" (valueChange)="setLocale($event)">
            <ix-select-item
              *ngFor="let l of locales"
              [value]="l.value"
              [label]="l.label"
            ></ix-select-item>
          </ix-select>
        </div>
        <div>
          <span style="margin-right: 0.5rem">Date format:</span>
          <ix-select [value]="dateFormat" (valueChange)="setDateFormat($event)">
            <ix-select-item
              *ngFor="let f of dateFormats"
              [value]="f.value"
              [label]="f.label"
            ></ix-select-item>
          </ix-select>
        </div>
        <div>
          <span style="margin-right: 0.5rem">Time format:</span>
          <ix-select [value]="timeFormat" (valueChange)="setTimeFormat($event)">
            <ix-select-item
              *ngFor="let f of timeFormats"
              [value]="f.value"
              [label]="f.label"
            ></ix-select-item>
          </ix-select>
        </div>
      </div>
    </ix-col>
  </ix-row>

  <ix-row>
    <ix-col size="12">
      <ix-datetime-picker
        [singleSelection]="true"
        [locale]="locale"
        [dateFormat]="dateFormat"
        [timeFormat]="timeFormat"
        [i18nAm]="i18nAm"
        [i18nPm]="i18nPm"
        [i18nHourColumnHeader]="i18nHourColumnHeader"
        [i18nMinuteColumnHeader]="i18nMinuteColumnHeader"
        [i18nSecondColumnHeader]="i18nSecondColumnHeader"
        (dateSelect)="onDateSelect($event)"
      ></ix-datetime-picker>
    </ix-col>
  </ix-row>

  <ix-row>
    <ix-col
      size="12"
      style="
        padding: 0.75rem 1rem;
        border: 1px solid var(--theme-color-weak-bdr);
        border-radius: 4px;
        background: var(--theme-color-2);
      "
    >
      <span style="display: block; font-weight: 700; margin-bottom: 0.5rem">
        Last dateSelect event
      </span>
      <ng-container *ngIf="lastEvent === null; else eventValues">
        <span style="color: var(--theme-color-soft-text)">
          Confirm a selection to see event values
        </span>
      </ng-container>
      <ng-template #eventValues>
        <ix-layout-grid no-margin>
          <ix-row>
            <ix-col
              size="2"
              style="font-weight: 600; color: var(--theme-color-std-text)"
            >
              from
            </ix-col>
            <ix-col style="font-family: monospace; color: var(--theme-color-primary)">
              {{ lastEvent?.from || '—' }}
            </ix-col>
          </ix-row>
          <ix-row>
            <ix-col
              size="2"
              style="font-weight: 600; color: var(--theme-color-std-text)"
            >
              to
            </ix-col>
            <ix-col style="font-family: monospace; color: var(--theme-color-primary)">
              {{ lastEvent?.to || '—' }}
            </ix-col>
          </ix-row>
          <ix-row>
            <ix-col
              size="2"
              style="font-weight: 600; color: var(--theme-color-std-text)"
            >
              time
            </ix-col>
            <ix-col style="font-family: monospace; color: var(--theme-color-primary)">
              {{ lastEvent?.time || '—' }}
            </ix-col>
            <ix-col style="color: var(--theme-color-soft-text); font-size: 0.8em">
              (locale-aware in 12h mode)
            </ix-col>
          </ix-row>
        </ix-layout-grid>
      </ng-template>
    </ix-col>
  </ix-row>
</ix-layout-grid>
